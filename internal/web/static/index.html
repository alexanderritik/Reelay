<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reelay</title>
<meta name="description" content="Self-hosted video API: upload a file, get a link that plays everywhere.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='3' width='22' height='18' rx='6' fill='%236a5cff'/%3E%3Cpath d='M10 8.8v6.4c0 .6.6.9 1.1.6l4.9-3.2a.7.7 0 0 0 0-1.2l-4.9-3.2c-.5-.3-1.1 0-1.1.6z' fill='white'/%3E%3C/svg%3E">
<script>
  // Apply a saved theme before first paint, so there is no flash.
  try { const t = localStorage.getItem("reelay-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/" aria-label="Reelay home">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M10 8.8v6.4c0 .6.6.9 1.1.6l4.9-3.2a.7.7 0 0 0 0-1.2l-4.9-3.2c-.5-.3-1.1 0-1.1.6z" fill="currentColor"/></svg>
      </span>
      <span class="brand-name">Reelay</span>
    </a>
    <nav class="nav">
      <a href="#/" data-nav="videos">Videos</a>
      <a href="#/api" data-nav="api">API</a>
    </nav>
    <div class="topbar-actions">
      <button id="themeBtn" class="icon-btn" type="button" aria-label="Switch theme" title="Switch theme">
        <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
      <button id="uploadBtn" class="btn primary" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
        <span>Upload</span>
      </button>
      <input id="fileInput" type="file" accept="video/*" multiple hidden>
    </div>
  </div>
</header>

<main id="view" class="main"></main>

<aside id="uploads" class="uploads" aria-live="polite" hidden></aside>

<div id="dropOverlay" class="drop-overlay" hidden>
  <div class="drop-card">
    <svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
    <strong>Drop to upload</strong>
    <span>Each video becomes a link that plays everywhere</span>
  </div>
</div>

<dialog id="confirm" class="dialog">
  <form method="dialog">
    <h3 id="confirmTitle"></h3>
    <p id="confirmText"></p>
    <div class="dialog-actions">
      <button class="btn" value="cancel">Cancel</button>
      <button class="btn danger" value="ok" id="confirmOk">Delete</button>
    </div>
  </form>
</dialog>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="/static/vendor/hls.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
